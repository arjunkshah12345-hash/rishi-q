[project]
name = "rishiq"
version = "0.2.0"
description = "RISHI-Q: falsifiable computational comparison of classical Sanskrit natural philosophy vs historical controls (ISEF2027)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Arjun Shah", email = "arjunkshah21@gmail.com" }]
urls = { Homepage = "https://github.com/arjunkshah12345-hash/rishi-q", Repository = "https://github.com/arjunkshah12345-hash/rishi-q" }
keywords = [
  "computational-humanities",
  "philosophy-of-physics",
  "sanskrit",
  "quantum-foundations",
  "nlp",
  "reproducibility",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16.0",
  "duckdb>=1.0",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
ml = [
  "torch>=2.3",
  "transformers>=4.42",
  "sentence-transformers>=3.0",
  "datasets>=2.20",
  "accelerate>=0.33",
]
viz = [
  "plotly>=5.22",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "plotly>=5.22",
]

[project.scripts]
rishiq = "rishiq.cli:app"
rishiq-isef = "rishiq.isef2027.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rishiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
mypy_path = "src"
