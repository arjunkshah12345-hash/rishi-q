name: rishiq-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Unit tests
        run: uv run pytest -q
      - name: Freeze integrity
        run: uv run python scripts/validate_isef2027_freeze.py
      - name: ISEF2027 status + harness
        run: |
          uv run rishiq-isef status
          uv run rishiq-isef reproduce --config configs/isef2027.yaml
      - name: Confirmatory still locked
        run: |
          out=$(uv run rishiq-isef confirmatory-status)
          echo "$out" | grep -q LOCKED
